name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format check
        run: npm run check
      - run: npm run typecheck
      - run: npm test
      - name: Build (bundles the Worker without deploying)
        run: npx wrangler deploy --dry-run --outdir dist

  layout:
    name: Responsive layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A local instance with throwaway secrets; nothing here talks to Cloudflare.
      - name: Start wrangler dev
        run: |
          printf 'IP_HASH_SECRET=ci-ip-hash-secret\nADMIN_TOKEN=layout-check-admin\n' > .dev.vars
          npx wrangler dev --port 8787 --var MAIN_ORIGIN:http://localhost:8787 --var FILES_ORIGIN:http://localhost:8787/_files --var TMP_ORIGIN:http://localhost:8787/_tmp --var FEATURE_ACCOUNTS:1 --var ACCOUNT_FEATURES:email,passkey "--var=MAIL_FROM:sugi <login@example.org>" --var RESEND_API_KEY:unused --var DONATE_ALIPAY_LINK:https://qr.alipay.com/example > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8787/ && exit 0; sleep 2; done
          cat wrangler-dev.log
          exit 1
      - run: npm run check:layout -- http://localhost:8787
